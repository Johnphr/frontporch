# Every push to main: run the tests, then push the Convex functions to the deployment that
# the CONVEX_DEPLOY_KEY secret belongs to (today: dev hip-dodo-105). Tests fail = no deploy.
# Key: Convex dashboard > deployment Settings > Deploy keys (permission deployment:deploy),
# stored as the GitHub Actions secret CONVEX_DEPLOY_KEY. Env vars stay in the dashboard.
name: Deploy Convex

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# One deploy at a time; a newer push waits for the running one instead of racing it.
concurrency:
  group: convex-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx convex deploy --typecheck enable
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
